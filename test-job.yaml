apiVersion: batch/v1
kind: Job
metadata:
  name: integration-test
spec:
  template:
    spec:
      containers:
      - name: curl
        image: curlimages/curl:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Starting integration test..."
          echo "Waiting for service to be ready..."
          sleep 15
          
          # The release name is "my-app", so service should be "my-app-my-app"
          SERVICE_NAME="my-app-my-app"
          
          echo "=== Testing /health endpoint ==="
          if curl -v -f http://${SERVICE_NAME}:8000/health; then
            echo "✓ Health check passed!"
          else
            echo "✗ Health check failed!"
            exit 1
          fi
          
          echo ""
          echo "=== Testing /write endpoint ==="
          if curl -v -f -X POST http://${SERVICE_NAME}:8000/write \
            -H "Content-Type: application/json" \
            -d '{"message": "Integration test successful!"}'; then
            echo "✓ Write test passed!"
          else
            echo "✗ Write test failed!"
            exit 1
          fi
          
          echo ""
          echo "🎉 All tests completed successfully!"
      restartPolicy: Never
  backoffLimit: 2