apiVersion: batch/v1
kind: Job
metadata:
  name: integration-test
spec:
  template:
    spec:
      containers:
      - name: curl
        image: curlimages/curl:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Starting integration test..."
          echo "Waiting for services to be ready..."
          sleep 20
          
          # Try different possible service names
          POSSIBLE_NAMES="my-app my-app-my-app release-name-my-app"
          SERVICE_NAME=""
          
          echo "=== Attempting to find the correct service name ==="
          for name in $POSSIBLE_NAMES; do
            echo "Trying: $name"
            if curl -s -f http://${name}:8000/health > /dev/null 2>&1; then
              echo "✓ Found working service name: $name"
              SERVICE_NAME=$name
              break
            else
              echo "✗ $name didn't work"
            fi
          done
          
          if [ -z "$SERVICE_NAME" ]; then
            echo "✗ Could not find any working service name!"
            exit 1
          fi
          
          echo ""
          echo "=== Testing /health endpoint with $SERVICE_NAME ==="
          curl -v -f http://${SERVICE_NAME}:8000/health
          echo "✓ Health check passed!"
          
          echo ""
          echo "=== Testing /write endpoint ==="
          curl -v -f -X POST http://${SERVICE_NAME}:8000/write \
            -H "Content-Type: application/json" \
            -d '{"message": "Integration test successful!"}'
          echo "✓ Write test passed!"
          
          echo ""
          echo "🎉 All tests completed successfully!"
      restartPolicy: Never
  backoffLimit: 2