name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Create Kind cluster
      uses: helm/kind-action@v1
      with:
        cluster_name: test-cluster
        wait: 30s
    
    - name: Verify cluster
      run: |
        kubectl cluster-info
        kubectl get nodes
    
    - name: Build Docker image
      run: |
        docker build -t my-fastapi-app:latest .
    
    - name: Load image into Kind cluster (Secret Sauce!)
      run: |
        kind load docker-image my-fastapi-app:latest --name test-cluster
    
    - name: Verify image is loaded
      run: |
        docker exec test-cluster-control-plane crictl images | grep my-fastapi-app
    
    - name: Install Helm chart
      run: |
        helm install my-app ./my-app --wait --timeout 2m
    
    - name: Wait for pods to be ready
      run: |
        kubectl wait --for=condition=ready pod --all --timeout=120s
    
    - name: Validate deployment
      run: |
        echo "=== All Pods ==="
        kubectl get pods
        echo ""
        echo "=== All Services ==="
        kubectl get svc
        echo ""
        echo "=== Deployment Logs ==="
        kubectl logs -l app.kubernetes.io/name=my-app --tail=50
    
    - name: Run integration test
      run: |
        echo "Applying integration test job..."
        kubectl apply -f test-job.yaml
        
        echo "Waiting for job to complete..."
        kubectl wait --for=condition=complete job/integration-test --timeout=60s
        
        echo "=== Job Status ==="
        kubectl get job integration-test
        
        echo "=== Job Logs ==="
        kubectl logs job/integration-test
    
    - name: Cleanup on failure
      if: failure()
      run: |
        echo "=== Pod Status ==="
        kubectl get pods
        echo ""
        echo "=== App Logs ==="
        kubectl logs -l app.kubernetes.io/name=my-app --tail=100
        echo ""
        echo "=== Postgres Logs ==="
        kubectl logs -l app=postgres --tail=100
        echo ""
        echo "=== Events ==="
        kubectl get events --sort-by='.lastTimestamp'