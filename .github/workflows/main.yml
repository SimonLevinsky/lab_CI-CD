name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Create Kind cluster
      uses: helm/kind-action@v1
      with:
        cluster_name: test-cluster
        wait: 30s
    
    - name: Verify cluster
      run: |
        kubectl cluster-info
        kubectl get nodes
    
    - name: Build Docker image
      run: |
        docker build -t my-fastapi-app:latest .
    
    - name: Load image into Kind cluster
      run: |
        kind load docker-image my-fastapi-app:latest --name test-cluster
    
    - name: Verify image is loaded
      run: |
        docker exec test-cluster-control-plane crictl images | grep my-fastapi-app
    
    - name: Install Helm chart
      run: |
        helm install my-app ./my-app --wait --timeout 2m
    
    - name: Debug - Show all services
      run: |
        echo "=== All Services ==="
        kubectl get svc -o wide
        echo ""
        echo "=== Service names only ==="
        kubectl get svc -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'
        echo ""
        echo "=== App service specifically ==="
        kubectl get svc -l app.kubernetes.io/name=my-app -o yaml || echo "No service found with app.kubernetes.io/name=my-app label"
    
    - name: Wait for pods to be ready
      run: |
        kubectl wait --for=condition=ready pod --all --timeout=120s
    
    - name: Validate deployment
      run: |
        echo "=== All Pods ==="
        kubectl get pods
        echo ""
        echo "=== All Services ==="
        kubectl get svc
        echo ""
        echo "=== FastAPI Application Logs ==="
        kubectl logs -l app.kubernetes.io/name=my-app --tail=100
        echo ""
        echo "=== PostgreSQL Logs ==="
        kubectl logs -l app=postgres --tail=100
    
    - name: Run integration test
      run: |
        echo "Applying integration test job..."
        kubectl apply -f test-job.yaml
        
        echo "Waiting for job to start..."
        sleep 5
        
        echo "=== Job Status ==="
        kubectl get job integration-test
        
        echo "=== Pod Status ==="
        kubectl get pods -l job-name=integration-test
        
        echo "=== Job Logs (if available) ==="
        kubectl logs -l job-name=integration-test --tail=50 || echo "No logs yet"
        
        echo "Waiting for job to complete..."
        kubectl wait --for=condition=complete job/integration-test --timeout=120s || {
          echo "Job failed to complete. Debugging info:"
          kubectl describe job integration-test
          kubectl get pods -l job-name=integration-test
          kubectl logs -l job-name=integration-test --tail=100 || echo "No logs available"
          exit 1
        }
        
        echo "=== Final Job Logs ==="
        kubectl logs -l job-name=integration-test
    
    - name: Cleanup on failure
      if: failure()
      run: |
        echo "=== Pod Status ==="
        kubectl get pods
        echo ""
        echo "=== App Logs ==="
        kubectl logs -l app.kubernetes.io/name=my-app --tail=100
        echo ""
        echo "=== Postgres Logs ==="
        kubectl logs -l app=postgres --tail=100
        echo ""
        echo "=== Events ==="
        kubectl get events --sort-by='.lastTimestamp'